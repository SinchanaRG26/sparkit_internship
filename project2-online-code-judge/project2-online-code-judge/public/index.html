<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JudgeLab</title>
  <meta name="description" content="JudgeLab - an online code judge with a queue-based execution engine.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Cpath d='M34 30 16 50l18 20M66 30l18 20-18 20M56 24 44 76' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="#/"><span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.8 12.4l3 3 5.6-6.6"/></svg></span>JudgeLab</a>
      <nav id="nav" aria-label="Main"></nav>
    </div>
  </header>
  <main id="app" class="wrap" aria-live="polite"></main>
  <footer class="foot">
    <div class="wrap foot-in">
      <span>JudgeLab &middot; code runs in a sandboxed process with time, memory and output limits</span>
      <span id="qstat" class="qstat" title="Execution queue">queue: &hellip;</span>
    </div>
  </footer>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
